name: Hosted CI
on:
  push:
    branches: [main, algo/ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          install_native_dependencies() {
            sudo env DEBIAN_FRONTEND=noninteractive timeout -k 15 300 apt-get "${apt_options[@]}" update &&
              sudo env DEBIAN_FRONTEND=noninteractive timeout -k 15 600 apt-get "${apt_options[@]}" install -y --no-install-recommends \
                libasound2-dev libudev-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev \
                libwebkit2gtk-4.1-dev fonts-noto-cjk fonts-unifont ffmpeg mesa-vulkan-drivers \
                libvulkan1 libgl1-mesa-dev
          }
          for attempt in 1 2; do
            if install_native_dependencies; then
              exit 0
            fi
            echo "Native dependency installation attempt ${attempt} failed; repairing dpkg state before retry."
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Install pinned FFmpeg oracle
        env:
          FFMPEG_ARCHIVE: ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 292e10a463befababcd31e0c7d0c1e068d46342398d9674534eb07517c1ba38e
        run: |
          archive="$RUNNER_TEMP/$FFMPEG_ARCHIVE"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-27-18-38/$FFMPEG_ARCHIVE" \
            --output "$archive"
          printf '%s  %s\n' "$FFMPEG_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          ffmpeg_bin="$RUNNER_TEMP/ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1/bin"
          "$ffmpeg_bin/ffmpeg" -version | head -n 1 | grep -F 'n8.1.3-24-g92611900bb'
          echo "$ffmpeg_bin" >> "$GITHUB_PATH"
          {
            echo "FILMCRAFT_FFMPEG=$ffmpeg_bin/ffmpeg"
            echo "FILMCRAFT_FFPROBE=$ffmpeg_bin/ffprobe"
            echo 'FILMCRAFT_REQUIRE_ORACLES=1'
          } >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - name: Workspace tests (tracked perf UI exception)
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/filmcraft-workspace-tests.log"
          test_status=${PIPESTATUS[0]}
          set -e

          if [[ "$test_status" -eq 0 ]]; then
            exit 0
          fi

          log="$RUNNER_TEMP/filmcraft-workspace-tests.log"
          failed_results=$(grep -Fc 'test result: FAILED.' "$log" || true)
          failed_tests=$(grep -Ec '^    [[:alnum:]_:]+$' "$log" || true)
          failed_target_count=$(grep -Eo '[0-9]+ targets? failed:' "$log" | tail -n 1 | cut -d ' ' -f1 || true)

          perf_ui_failure=0
          if grep -Fq -- '-p filmcraft-ui-egui --test it' "$log" \
            && grep -Fq -- '---- perf_ui::program_monitor_plays_on_while_a_value_is_dragged stdout ----' "$log" \
            && grep -Fq 'the picture kept playing during the drag:' "$log"; then
            perf_ui_failure=1
          fi

          allowed_failure_count=$perf_ui_failure
          if [[ "$allowed_failure_count" -gt 0 ]] \
            && [[ "$failed_target_count" -eq "$allowed_failure_count" ]] \
            && [[ "$failed_results" -eq "$allowed_failure_count" ]] \
            && [[ "$failed_tests" -eq "$allowed_failure_count" ]]; then
            if [[ "$perf_ui_failure" -eq 1 ]]; then
              echo '::warning::Known hosted Linux frame-rate assumption in the Program monitor drag test; tracked in https://github.com/speedcraft-labs/hyper/issues/264'
            fi
            exit 0
          fi

          exit "$test_status"
